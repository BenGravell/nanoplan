repos:
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        entry: bash -c 'mdformat --wrap=no --no-wrap-sentences "$@" && mdformat --slw-markers=.!? --slw-wrap=120 "$@"' --
        exclude: ^\.agents/
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-slw==0.2.0

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        always_run: true
        pass_filenames: false

      - id: cargo-clippy-fix
        name: cargo clippy fix
        entry: cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features -- -D warnings
        language: system
        always_run: true
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        always_run: true
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets --all-features
        language: system
        always_run: true
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete
        entry: mise exec -- cargo machete
        language: system
        always_run: true
        pass_filenames: false
