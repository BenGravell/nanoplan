<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>nanoplan</title>
    <meta name="theme-color" content="" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="nanoplan" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      data-trunk
      rel="rust"
      data-bin="nanoplan"
      data-wasm-opt="4"
      data-initializer="web/initializer.js"
    />
    <link
      data-trunk
      rel="rust"
      data-bin="planner-worker"
      data-type="worker"
      data-bindgen-target="web"
      data-loader-shim
      data-wasm-opt="4"
    />
    <link data-trunk rel="css" href="web/colors.css" />
    <link data-trunk rel="css" href="web/fonts.css" />
    <link data-trunk rel="css" href="web/style.css" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-dir" href="assets/icons" />
    <link data-trunk rel="copy-dir" href="assets/fonts" />
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite" aria-atomic="true">
      <div class="startup-panel">
        <div id="startup-icon" aria-hidden="true"></div>
        <div>
          <div id="startup-title">Opening nanoplan</div>
          <div id="startup-detail">Connecting to the driving engine.</div>
          <div id="startup-transfer" aria-hidden="true"></div>
          <div class="startup-meter" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <button id="fullscreen" aria-label="Enter full screen" title="Full screen">
      <img src="icons/maximize.svg" alt="" />
    </button>
    <script data-trunk src="web/startup.js"></script>
    <script data-trunk src="web/fullscreen.js"></script>
  </body>
</html>
